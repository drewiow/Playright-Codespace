<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PinnacleAI Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">
        <div class="brand"><img src="/images/assistant.png"></div>
        <div id="messages" class="messages"></div>
        <div class="input-row">
            <input id="messageInput" placeholder="Update FKN03 telephone number to 01983 565656">
            <button id="sendBtn">Analyse</button>
        </div>

        <div id="env-modal" class="modal hidden">

            <div class="modal-content">

                <h3>Load Environment</h3>

                <input type="file" id="env-file" accept=".enc" hidden>

                <label for="env-file" class="file-picker">

                    📁 Select Environment File

                </label>

                <div id="selected-file">
                    No file selected
                </div>

                <input type="password" id="env-passphrase" placeholder="Passphrase">

                <div class="modal-buttons">

                    <button id="load-env-confirm">
                        Load
                    </button>

                    <button id="load-env-cancel">
                        Cancel
                    </button>

                </div>

            </div>

        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>

</html>
