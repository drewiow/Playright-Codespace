<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PinnacleAI Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">
        <div class="brand">
            <img src="/images/assistant.png">
        </div>
        <div id="environment-status" class="environment-status disconnected">

            🔴 No Environment Loaded

        </div>
        <button id="load-env-btn">
            Load Environment
        </button>
        <p class="subtitle">Describe what you'd like done.</p>
        <div id="messages" class="messages"></div>
        <div class="input-row">
            <input id="messageInput" placeholder="Update FKN03 telephone number to 01983 565656">
            <button id="sendBtn">Analyse</button>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>

</html>
